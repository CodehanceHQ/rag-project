# Corpus manifest — the fact table the corpus is built from.
#
# The corpus is the paperwork of a small bakery company, Sunrise Bakery: three
# sites, a sourdough range, three flour mills. It is the source of truth for
# the entities, the documents that hold them, the negative constraints that
# keep the hard questions hard, and the 25 benchmark questions.
#
# Never adjust the corpus to protect a number that was guessed before
# measuring. Measure, then record what was measured.

meta:
  scale:
    documents: 100
    pages_total: ~1900
  domain: fictional bakery company — sourdough, flour mills, three sites

  # The corpus has a declared NOW, and every date is assigned relative to it
  # rather than to the real calendar, so the corpus does not rot.
  corpus_now: "2026-03"
  dating_rules: |
    RC-88          2024-09-11 — eighteen months before corpus_now, and inside
                                AM-2024-01's window
    AM-2024-01     2024-01    — in force when RC-88 was raised
    AM-2025-03     2025-03    — current as at corpus_now
    W-2025-014     2025-02    — after RC-88, so the withdrawal postdates the
                                flour change
    RC-91          2025-06-16 — inside the 2025 waste series, four months
                                clear of either end (see ag-03)
    waste series   2025-01 .. 2025-12
    If corpus_now moves, every one of these moves with it.

  authored: 31        # carry the chains. 29 written by hand, plus the two
                      # Product Specification Books built by specbooks.py
  constrained: 18     # 12 monthly waste returns + 6 routine recipe changes.
                      # Seeded, so the aggregation answers are known before
                      # generation, not discovered after.
  special: 2          # exist to defeat text extraction
  ballast: 49         # filler. Templated and repetitive, because real
                      # paperwork is. It is what buries the right passage.

# ---------------------------------------------------------------------------
# ENTITIES — every named thing in the corpus. Values are binding.
# ---------------------------------------------------------------------------
entities:
  products:
    - id: SD-12
      name: Classic Sourdough
      note: the withdrawn product — W-2025-014 names it
    - id: SD-13
      name: Country Sourdough
      note: |
        The near-twin. Same range, almost the same name, a different shelf
        life (6 days against 4), a different oven and a different oven
        temperature. Its values are the plausible wrong answers to sh-01,
        mh-03 and am-02.

  ingredients:
    - id: golden-field
      name: Golden Field flour
      note: |
        The OUTGOING flour for SD-12, replaced at RC-88. It appears in the
        2024 Product Specification Book and nowhere later.
    - id: heritage-stoneground
      name: Heritage Stoneground flour
      note: |
        The discovered-vocabulary term: it cannot be guessed from a question
        about the launch. See negatives.flour_undiscoverable.

  suppliers:
    - id: alder
      code: SUP-0207
      name: Alder Mill
      based_in: Ashby
      supplies_products: [SD-12, SD-13]
      supplies_sites: [riverside, station-road]     # deliberately NOT High Street
      note: |
        The plausible wrong answer to mh-01. Alder supplies two sites, just
        not that one, and its delivery round passes the High Street bakery.
    - id: birch
      code: SUP-0311
      name: Birch Lane Mill
      based_in: Thornbury
      supplies_products: [SD-12]
      supplies_sites: [high-street, station-road]
      note: the correct answer to mh-01
    - id: cedar
      code: SUP-0407
      name: Cedar Valley Mill
      based_in: Ludwell
      supplies_products: [SD-13]                    # never SD-12, never common
      supplies_sites: [high-street, riverside]
      note: |
        Approved at High Street but sources no SD-12 line, so it must not be
        an answer to mh-01. See negatives.cedar_not_sd12.

  sites:
    - id: high-street
      name: High Street bakery
      suppliers: [birch, cedar]
      note: mh-01's third hop. Carries ld-02's four underweight-loaf incidents.
    - id: riverside
      name: Riverside bakery
      suppliers: [alder, cedar]
      note: dough preparation and shaping only — it does not bake (sh-03)
    - id: station-road
      name: Station Road bakery
      suppliers: [alder, birch]
      note: |
        The ag-01 winner, NOT High Street: High Street already carries ld-02's
        story, and a shared winner would let the answer be inferred from the
        narrative instead of added up.

  records:
    - id: W-2025-014
      kind: withdrawal
      subject: Classic Sourdough (SD-12)
    - id: RC-88
      kind: recipe_change
      subject: SD-12 flour revised to Heritage Stoneground flour
      date: "2024-09-11"
    - id: RC-91
      kind: recipe_change
      subject: SD-12 baking procedure — adds steam and a core temperature check
      date: "2025-06-16"
      note: |
        RC-91 changes the PROCEDURE, not the temperature. Revisions C and D of
        the baking instruction both say 230 °C; revision C has no steam and no
        core check. A superseded revision can therefore only give an
        INCOMPLETE answer, never a contradictory one.
    - id: batch 4471
      kind: quality_rejection
      subject: dough hydration out of tolerance

  authority:
    level_required_for_ingredient_change: Level 3
    matrices:
      - id: AM-2024-01
        effective: 2024-01
        status: superseded
        level_3_role: Head of Production
        level_3_holder: Helen Brandt
      - id: AM-2025-03
        effective: 2025-03
        status: current
        level_3_role: Head of Food Safety
        level_3_holder: Martin Osterman
    note: |
      mh-02 depends on there being TWO matrices and on RC-88 falling under the
      older one. The matrices give Level 3 to a ROLE; role_appointments.pdf
      resolves role -> person -> dates. That is what makes mh-02 four hops.

  baking:
    oven: deck oven
    temperature: 230 °C
    steam: first 10 minutes
    core_check: after 35 minutes
    note: |
      cl-01 requires the chunk containing "Set it to 230 °C" to NOT name the
      deck oven. See negatives.oven_referent.

# ---------------------------------------------------------------------------
# DOCUMENTS — which document holds which fact. Names become expected_sources.
# ---------------------------------------------------------------------------
documents:
  - file: withdrawal_W-2025-014.pdf
    holds: [SD-12 is the withdrawn product, withdrawal date, affected batches]
    must_not_hold: [supplier names, any site name, Heritage Stoneground]
  - file: withdrawal_register_2023_2025.pdf
    holds: [list of withdrawals incl. W-2025-014, shown as open]
  - file: product_specifications_2025.pdf
    holds: [SD-12 flour sources = Alder + Birch, SD-12 shelf life 4 days,
            SD-13 shelf life 6 days, SD-12 flour = Heritage Stoneground flour]
    must_not_hold: [any site name, withdrawal references, Golden Field,
                    any formerly/previously annotation]
  - file: product_specifications_2024.pdf
    status: superseded
    holds: ["SD-12 flour = Golden Field flour"]
    must_not_hold: [Heritage Stoneground, RC-88, any reference to a later edition]
  - file: site_register.pdf
    holds: [approved supplier CODES per site, what each site does]
    must_not_hold: [supplier names, product names, withdrawal references]
  - file: supplier_register.pdf
    holds: [code -> company -> town for all three mills]
    note: section 3 mentions Alder Mill and the High Street together — the decoy for mh-01
  - file: quality_batch_4471.pdf
    holds: ["batch 4471 rejected, dough hydration out of tolerance"]
    fragment_of: launch_delay
  - file: test_kitchen_minutes_q1_2025.pdf
    holds: ["oven 3 reallocated to the hot cross bun launch for six weeks"]
    fragment_of: launch_delay
  - file: RC-88_flour_change.pdf
    holds: [flour revised to Heritage Stoneground flour, date, Class A]
    fragment_of: launch_delay
  - file: allergen_retest_certificate.pdf
    holds: ["allergen retest required following the ingredient change"]
    fragment_of: [launch_delay, withdrawal_obligations]
  - file: launch_plan_sourdough.pdf
    note: |
      The decoy for ld-01: original and revised dates for the launch, and not
      one word of explanation.
  - file: baking_instruction_rev_D.pdf
    holds: [deck oven, steam first 10 minutes, 230 °C, core check after 35 minutes]
  - file: baking_instruction_rev_C.pdf
    status: superseded
    holds: [deck oven, 230 °C]
    must_not_hold: [steam, core temperature, any other oven temperature]
  - file: baking_instruction_country.pdf
    holds: [SD-13, rack oven, 210 °C]
    must_not_hold: [SD-12, Classic Sourdough, 230 °C]
  - file: RC-91_baking_update.pdf
    role: decoy
    note: states exactly what changed in the baking procedure and nothing about why
  - {file: ncr_high_street_2025_02.pdf, fragment_of: high_street_recurring}
  - {file: supplier_complaint_2025_05.pdf, fragment_of: high_street_recurring}
  - {file: production_stoppage_high_street_2025_08.pdf, fragment_of: high_street_recurring}
  - {file: customer_complaint_2025_10.pdf, fragment_of: high_street_recurring}
  - {file: customer_feedback_2024_h2.pdf, fragment_of: baking_cause}
  - {file: test_kitchen_bake_trials.pdf, fragment_of: baking_cause}
  - {file: regulator_notification_W-2025-014.pdf, fragment_of: withdrawal_obligations}
  - {file: corrective_action_commitment_2025_04.pdf, fragment_of: withdrawal_obligations}
  - {file: stock_return_log.pdf, fragment_of: withdrawal_obligations}
  - file: recipe_change_approval_procedure.pdf
    holds: [class -> level table, Level 1 for a documentation-only change,
            Level 3 for any change to an allergen-critical recipe]
    must_not_hold: [names of authority holders]
  - {file: approval_matrix_2025_03.pdf, holds: [current Level 3 role]}
  - {file: approval_matrix_2024_01.pdf, status: superseded, holds: [earlier Level 3 role]}
  - {file: role_appointments.pdf, holds: [who held which role, with dates]}
  - file: waste_2025_01.pdf .. waste_2025_12.pdf
    count: 12
    holds: [monthly waste counts per site]
  - file: RC-84 .. RC-97 (six generated recipe changes)
    count: 6
    note: same house style as RC-88 and RC-91 — a class, no level, no person
  - {file: facilities_site_services.pdf, role: noise}
  - {file: obsolete_product_catalogue_pre2020.pdf, role: noise, status: superseded}
  - file: tolerance_tables.pdf
    holds: [SD-12 baked weight tolerance by class, oven temperature bands by revision]
  - {file: inspection_cert_scanned.pdf, role: parsing_challenge, note: image-only}
  - {file: bakery_floor_layout_diagram.pdf, role: parsing_challenge, note: callouts only}

# ---------------------------------------------------------------------------
# NEGATIVE CONSTRAINTS — the tests that keep the failures real.
# A corpus that accidentally puts two facts in one place silently turns a
# three-step question into a one-step one.
# ---------------------------------------------------------------------------
negatives:
  multihop_supplier:
    assert: |
      site_register.pdf records approved sources by CODE only and names no
      mill. The mapping code -> company exists only in supplier_register.pdf.
    assert_no_cooccurrence:
      - [SD-12, High Street]              # in any single document
      - [Classic Sourdough, High Street]
      - [withdrawal, High Street]
      - ["W-2025-014", "Alder Mill"]
      - ["W-2025-014", "Birch Lane"]
    reason: mh-01 — its hops must really be separate lookups

  launch_delay:
    forbidden_words_in_fragments: [delay, delayed, late, postponed, slipped, schedule]
    forbidden_except:
      test_kitchen_minutes_q1_2025.pdf: |
        The word "launch" appears ONCE, as part of "the hot cross bun launch"
        — a DIFFERENT launch. It is the nearest the fragments come to the
        question's vocabulary and it points the wrong way.
    applies_to:
      - quality_batch_4471.pdf
      - test_kitchen_minutes_q1_2025.pdf
      - RC-88_flour_change.pdf
      - allergen_retest_certificate.pdf
    reason: |
      ld-01's mechanism. If a fragment says "this delayed the launch",
      similarity search finds it and the long-distance example collapses.

  cedar_not_sd12:
    assert: |
      In both editions of the Product Specification Book, Cedar Valley Mill is
      a source for SD-13 lines only — no SD-12 line, no common ingredient —
      and the approved supplier index says so.
    reason: mh-01 must have ONE answer. High Street approves Birch and Cedar.

  rc88_class_recorded:
    assert: |
      RC-88_flour_change.pdf records "Classification | Class A", as the
      generated recipe changes do. It names no person and no level.
    reason: mh-02's second hop is class -> level. Also what ag-02 counts.

  flour_undiscoverable:
    assert: |
      "Heritage Stoneground" appears in NO document title, NO section heading,
      NO filename, and NOT in the withdrawal report or the launch plan.
    reason: ld-01 depends on the flour's name being unreachable by rephrasing the question.

  oven_referent:
    assert: |
      In a 1000-character fixed-width chunking of baking_instruction_rev_D.pdf,
      at least one chunk contains "230 °C" and does NOT contain "deck oven".
    reason: cl-01's lost-context example. A CHUNKING property, not a document property.

  aggregation_needs_all:
    assert: |
      No single waste_2025_*.pdf states the annual total or the winner, and no
      month shows the annual winner as that month's worst site. The ag-01
      winner is NOT High Street.
    reason: ag-01 — no value of k rescues this

  authority_split:
    assert: |
      recipe_change_approval_procedure.pdf names the required LEVEL but no
      PERSON; the matrices name roles but not RC-88; and RC-88 itself names NO
      person and NO level — only the change, its date, the procedure revision
      and its CLASS.
    reason: mh-02 — keeps the chain at four hops

  high_street_recurring:
    forbidden_words_in_fragments: [recurring, repeated, pattern, systemic,
                                   trend, ongoing, again, chronic, "third time"]
    applies_to:
      - ncr_high_street_2025_02.pdf
      - supplier_complaint_2025_05.pdf
      - production_stoppage_high_street_2025_08.pdf
      - customer_complaint_2025_10.pdf
    assert: |
      No document lists more than one of the four incidents, and no fragment
      names SD-12 or the Classic Sourdough (protects multihop_supplier).
    assert_decoy: |
      facilities_site_services.pdf carries a "High Street site quality
      overview" section with heavy lexical overlap and no incident detail.
    reason: ld-02. The answer is a judgement about REPETITION, which no ranked list of five can produce.

  baking_cause:
    forbidden_words_in_fragments: [why, because, cause, "root cause", reason,
                                   "led to", "resulted in", prompted, "due to"]
    applies_to:
      - customer_feedback_2024_h2.pdf
      - test_kitchen_bake_trials.pdf
      - tolerance_tables.pdf
    assert: |
      RC-91_baking_update.pdf states the new steam and core-check steps and
      the date, and contains no rationale.
    reason: ld-03. A second chain, independent of the withdrawal.

  withdrawal_obligations:
    forbidden_words_in_fragments: [outstanding, "open item", "still owed",
                                   overdue, "pending closure", unresolved,
                                   incomplete, owed, remaining]
    applies_to:
      - regulator_notification_W-2025-014.pdf
      - corrective_action_commitment_2025_04.pdf
      - stock_return_log.pdf
      - allergen_retest_certificate.pdf
    assert: |
      Each of the four documents records exactly ONE open obligation, stated
      POSITIVELY (a due date, an in-progress status, a count not yet returned,
      a booked test). No document lists them together, and none names a site.
    reason: ld-04. The difficulty is purely that no passage resembles the question.

  ballast_vocabulary:
    assert: |
      Ballast varies WORDING, never VOCABULARY. It may not introduce any site,
      supplier, product, flour, recipe change or withdrawal that is not listed
      in `entities`, and no ballast document may contain any pair listed in
      any assert_no_cooccurrence block in this file.
    reason: |
      Half the corpus is generated filler. One invented site or product in it
      can answer an unanswerable question or collapse a multi-hop one.

  un01_absent_fact:
    expected_behaviour: decline
    assert: The words "calorie" and "calories" appear in NO document.

  un02_absent_site:
    expected_behaviour: decline
    assert: The string "Market Square" appears in NO document — authored or ballast.
    reason: |
      un-02. The only test of refusal AFTER partial success — two hops land
      and the third has nothing. That is where a system fabricates.

  sh_baseline_must_win:
    assert: |
      Every single-hop answer sits in ONE document, in ONE section, with heavy
      lexical overlap between the question and the passage.
    reason: |
      Single-hop is where a single-pass pipeline should be at its best. If
      Path A loses these rows, the benchmark is measuring something else.

  am01_undated_authority:
    expected_behaviour: clarify
    assert: Both approval matrices are retrievable, and neither says it is the only one.
    reason: am-01 is mh-02 with the date clause deleted — same documents, opposite correct behaviour.

  am02_undisambiguated_oven:
    expected_behaviour: clarify
    assert: |
      SD-12 and SD-13 are baked in different ovens at different temperatures,
      in separate instructions. No document contains both temperatures.
    reason: am-02 — a chunk full of oven language answers a question about the wrong loaf.

  ag02_no_register:
    assert: |
      No register, index or log of recipe changes exists. The only way to
      count them is to find all of them. No recipe change states a level or
      names an approver, and none but RC-88 mentions Heritage Stoneground.
    reason: ag-02. A register would turn the count into one read.

  ag03_pivot_discovered:
    assert: |
      RC-91's date falls inside the 2025 waste series with at least four
      months either side, and no waste return mentions RC-91 or any change to
      a procedure.
    reason: ag-03. The boundary of the comparison is in a different document.

  cl02_table_header:
    assert: |
      In a 1000-character split of tolerance_tables.pdf, at least one chunk
      contains the "SD-12 baked weight" row and NOT the column header row.
    reason: cl-02. The lost context is a column heading, not a noun.

  cl03_edition_orphaned:
    assert: |
      In a 1000-character split of product_specifications_2024.pdf, at least
      one chunk contains "Golden Field" and does NOT contain "2024".
    reason: cl-03. The chunk cannot say which edition it came from.

  cl04_scope_orphaned:
    assert: |
      In a 1000-character split of recipe_change_approval_procedure.pdf, at
      least one chunk contains "Level 3 approval is required" and NOT the
      word "allergen-critical".
    reason: cl-04. The retrieved sentence is TRUE and the answer is still wrong.

  mh03_identity:
    assert_no_cooccurrence:
      - ["RC-88", "Shelf life"]
    assert: |
      SD-12 and SD-13 sit in the same table layout with different shelf
      lives, and the product name and code are all that tell them apart.
    reason: mh-03. SD-13's value is the retrievable wrong answer.

  mh04_no_summary:
    assert_no_cooccurrence:
      - ["W-2025-014", "AM-2024-01"]
      - ["W-2025-014", "AM-2025-03"]
    assert: No document carries two of mh-04's three legs together.
    reason: mh-04. A summary document would turn the fan-out into one read.

  mh05_flour_supersession:
    assert_no_cooccurrence:
      - ["Golden Field", "Heritage Stoneground"]
    assert: |
      RC-88 does not name the outgoing flour. The 2025 book carries no
      "formerly" note. Golden Field appears in the 2024 book and nowhere later.
    reason: mh-05. One sentence reading "changed from A to B" collapses it to a single hop.

# ---------------------------------------------------------------------------
# QUESTIONS — written first; the corpus exists to serve them.
# `answer` holds the fact and nothing else, because the grader reads named
# things and measurements out of it. Asides belong in wrong_answer_path_a.
# ---------------------------------------------------------------------------
questions:
  - id: sh-01
    shape: single_hop
    q: What is the shelf life of the Classic Sourdough?
    answer: 4 days
    wrong_answer_path_a: 6 days
    expected_sources: [product_specifications_2025.pdf]
    role: one lookup. SD-13's 6 days is the near-identical wrong answer.

  - id: sh-02
    shape: single_hop
    q: Which product was withdrawn under W-2025-014?
    answer: Classic Sourdough (SD-12)
    expected_sources: ["withdrawal_W-2025-014.pdf"]
    role: hop 1 of mh-01, asked alone

  - id: sh-03
    shape: single_hop
    q: What does the Riverside bakery do?
    answer: Dough preparation and shaping. It does not bake.
    expected_sources: [site_register.pdf]

  - id: sh-04
    shape: single_hop
    q: What was found wrong with batch 4471?
    answer: dough hydration out of tolerance
    expected_sources: [quality_batch_4471.pdf]
    role: fragment 1 of ld-01. Findable here; not rankable there.

  - id: sh-05
    shape: single_hop
    q: Where is Alder Mill based?
    answer: Ashby
    expected_sources: [supplier_register.pdf]

  - id: mh-01
    shape: multi_hop
    q: Which flour supplier for the withdrawn product also supplies the High Street bakery?
    answer: Birch Lane Mill
    wrong_answer_path_a: Alder Mill
    expected_sources: ["withdrawal_W-2025-014.pdf", product_specifications_2025.pdf,
                       site_register.pdf, supplier_register.pdf]
    negatives: [multihop_supplier, cedar_not_sd12]
    role: |
      The central multi-hop example. Withdrawal -> product -> its flour
      sources -> the site's approved codes -> the company behind the code.

  - id: mh-02
    shape: multi_hop
    q: Who was authorised to approve the change to Heritage Stoneground flour at the time it was made?
    answer: Helen Brandt
    wrong_answer_naive: Martin Osterman
    expected_sources: [RC-88_flour_change.pdf, recipe_change_approval_procedure.pdf,
                       approval_matrix_2024_01.pdf, role_appointments.pdf]
    negatives: [authority_split, rc88_class_recorded]
    role: four hops with a date dependency

  - id: mh-03
    shape: multi_hop
    q: Which product did recipe change RC-88 apply to, and what is that product's shelf life?
    answer: Classic Sourdough (SD-12); 4 days
    wrong_answer_path_a: 6 days
    expected_sources: [RC-88_flour_change.pdf, product_specifications_2025.pdf]
    negatives: [mh03_identity]
    role: sh-01 reached the long way. Difficulty is a property of the PATH, not the fact.

  - id: mh-04
    shape: multi_hop
    q: Give me the full picture on the product withdrawn in W-2025-014 — who supplies
       its flour, which of those suppliers serve the High Street bakery, and who held
       the authority to approve its flour change at the time that change was made.
    answer: |
      Classic Sourdough (SD-12). Flour suppliers: Alder Mill and Birch Lane
      Mill. Of those, Birch Lane Mill serves the High Street bakery. The flour
      change (RC-88) required Level 3; the holder at that date was Helen Brandt.
    expected_sources: ["withdrawal_W-2025-014.pdf", product_specifications_2025.pdf,
                       site_register.pdf, supplier_register.pdf, RC-88_flour_change.pdf,
                       recipe_change_approval_procedure.pdf, approval_matrix_2024_01.pdf,
                       role_appointments.pdf]
    negatives: [mh04_no_summary, multihop_supplier, authority_split]
    role: the fan-out case — one shared hop, then three independent legs

  - id: mh-05
    shape: multi_hop
    q: What flour did the Classic Sourdough use before the current one, and when did it change?
    answer: Golden Field flour; changed at RC-88 on 2024-09-11
    wrong_answer_naive: Heritage Stoneground flour
    expected_sources: [RC-88_flour_change.pdf, product_specifications_2024.pdf]
    negatives: [mh05_flour_supersession]
    role: you cannot know which edition to open until you know when the change happened

  - id: ld-01
    shape: long_distance
    q: Why was the Classic Sourdough launch delayed?
    answer: a rejected batch (4471), oven 3 reallocated for six weeks, the flour change to Heritage Stoneground flour, and the allergen retest it forced
    expected_sources: [quality_batch_4471.pdf, test_kitchen_minutes_q1_2025.pdf,
                       RC-88_flour_change.pdf, allergen_retest_certificate.pdf]
    wrong_answer_path_a: |
      launch_plan_sourdough.pdf — top hit, shows the dates moving, explains nothing
    negatives: [launch_delay, flour_undiscoverable]
    unwritten_abstraction: delayed
    role: the central long-distance example

  - id: ld-02
    shape: long_distance
    q: Is there a recurring quality problem at the High Street bakery?
    answer: |
      Yes — four separate incidents of underweight loaves at the High Street
      bakery across 2025 (February, May, August and October), each recorded by
      a different function and none referring to any other.
    expected_sources: [ncr_high_street_2025_02.pdf, supplier_complaint_2025_05.pdf,
                       production_stoppage_high_street_2025_08.pdf, customer_complaint_2025_10.pdf]
    wrong_answer_path_a: |
      the "High Street site quality overview" section of facilities_site_services.pdf
      — a near-perfect lexical match that reports no incidents
    negatives: [high_street_recurring]
    unwritten_abstraction: recurring

  - id: ld-03
    shape: long_distance
    q: Why was the baking procedure for the Classic Sourdough changed?
    answer: |
      Customers reported gummy centres; test kitchen trials reproduced it and
      showed steam fixed it; the oven temperature band was found too wide and
      was tightened; RC-91 added steam for the first 10 minutes and a core
      temperature check after 35 minutes. The oven temperature did not change.
    expected_sources: [customer_feedback_2024_h2.pdf, test_kitchen_bake_trials.pdf,
                       tolerance_tables.pdf, RC-91_baking_update.pdf]
    wrong_answer_path_a: |
      RC-91_baking_update.pdf — top hit, states what changed, explains nothing
    negatives: [baking_cause]
    unwritten_abstraction: why

  - id: ld-04
    shape: long_distance
    q: What do we still owe the food safety authority on withdrawal W-2025-014?
    answer: |
      Four things: the follow-up report due 2026-05-29, the corrective action
      still in progress (the metal detector), 48 loaves not yet returned, and
      the allergen retest booked for 2026-04-14.
    expected_sources: ["regulator_notification_W-2025-014.pdf", corrective_action_commitment_2025_04.pdf,
                       stock_return_log.pdf, allergen_retest_certificate.pdf]
    negatives: [withdrawal_obligations]
    unwritten_abstraction: outstanding

  - id: cl-01
    shape: context_loss
    q: What temperature is the deck oven set to for the Classic Sourdough?
    answer: 230 °C, with steam for the first 10 minutes and a core temperature check after 35 minutes
    expected_sources: [baking_instruction_rev_D.pdf]
    negatives: [oven_referent]
    mechanism: referent stranded across a chunk boundary

  - id: cl-02
    shape: context_loss
    q: What is the baked weight tolerance for the Classic Sourdough?
    answer: 10 g at Class A, 20 g at Class B, 30 g at Class C
    expected_sources: [tolerance_tables.pdf]
    negatives: [cl02_table_header]
    mechanism: table row orphaned from its column headers

  - id: cl-03
    shape: context_loss
    q: What flour is currently specified for the Classic Sourdough?
    answer: Heritage Stoneground flour
    wrong_answer_path_a: Golden Field flour
    expected_sources: [product_specifications_2025.pdf, RC-88_flour_change.pdf]
    negatives: [cl03_edition_orphaned]
    mechanism: document edition orphaned from its content

  - id: cl-04
    shape: context_loss
    q: What approval level is required for a documentation-only change?
    answer: Level 1
    wrong_answer_path_a: Level 3
    expected_sources: [recipe_change_approval_procedure.pdf]
    negatives: [cl04_scope_orphaned]
    mechanism: scope qualifier orphaned from the rule it limits

  - id: ag-01
    shape: aggregation
    q: Which bakery had the most waste in 2025, and was the trend improving?
    answer: Station Road bakery, with 2311 loaves wasted, and yes — waste fell across the year
    expected_sources: ["waste_2025_01.pdf .. waste_2025_12.pdf"]
    negatives: [aggregation_needs_all]
    k_property: twelve reports, all needed, in order — more than any sensible k

  - id: ag-02
    shape: aggregation
    q: How many recipe changes were raised, and how many of them required Level 3 approval?
    answer: 8 recipe changes; 2 of them (RC-88 and RC-95) required Level 3
    expected_sources: ["every RC-*.pdf in the corpus", recipe_change_approval_procedure.pdf]
    negatives: [ag02_no_register]
    k_property: the size of the set is learned by reading it

  - id: ag-03
    shape: aggregation
    q: Did waste at the High Street bakery fall after the baking procedure was revised?
    answer: Yes — about 189 loaves a month before RC-91 and about 159 a month after
    expected_sources: ["RC-91_baking_update.pdf", "waste_2025_01.pdf .. waste_2025_12.pdf"]
    negatives: [ag03_pivot_discovered, aggregation_needs_all]
    k_property: the BOUNDARY of the comparison is a date held in another document

  - id: am-01
    shape: ambiguous
    q: Who is authorised to approve an ingredient change?
    expected_behaviour: clarify
    ambiguity_axis: date
    answer: |
      No single answer. Helen Brandt held Level 3 under AM-2024-01; Martin
      Osterman holds it under AM-2025-03. Correct behaviour is to ask as at
      what date, or to answer with both, scoped.
    expected_sources: [recipe_change_approval_procedure.pdf, approval_matrix_2024_01.pdf,
                       approval_matrix_2025_03.pdf]
    negatives: [am01_undated_authority]

  - id: am-02
    shape: ambiguous
    q: What temperature should the oven be set to for the sourdough?
    expected_behaviour: clarify
    ambiguity_axis: product
    answer: |
      No single answer. The Classic Sourdough bakes in the deck oven at 230 °C;
      the Country Sourdough bakes in the rack oven at 210 °C. Correct
      behaviour is to ask which product.
    expected_sources: [baking_instruction_rev_D.pdf, baking_instruction_country.pdf]
    negatives: [am02_undisambiguated_oven]

  - id: un-01
    shape: unanswerable
    q: How many calories are in the Classic Sourdough?
    answer: NOT_IN_CORPUS
    expected_behaviour: decline
    expected_sources: []
    negatives: [un01_absent_fact]

  - id: un-02
    shape: unanswerable
    q: Which flour supplier for the withdrawn product also supplies the Market Square bakery?
    answer: NOT_IN_CORPUS — there is no record of a Market Square bakery
    expected_behaviour: decline
    expected_sources: []
    negatives: [un02_absent_site, ballast_vocabulary]
    wrong_answer_path_a: |
      probably the High Street's supplier, cited. Confidently wrong in the
      same shape as mh-01, on a question whose right answer was "we do not
      have that".

# ---------------------------------------------------------------------------
# GRADING — not every shape is scored the same way.
# ---------------------------------------------------------------------------
grading:
  default: |
    Outcome — is the final answer correct and grounded — plus sources hit
    against expected_sources.
  ambiguous: |
    An ambiguous question is answered CORRECTLY by refusing to give a single
    answer and naming the right ambiguity_axis (date for am-01, product for
    am-02).
  unanswerable: |
    Correct behaviour is to say the corpus does not contain it. A produced
    answer is a failure however fluent.

question_targets:
  single_hop: 5
  multi_hop: 5
  long_distance: 4
  context_loss: 4
  aggregation: 3
  ambiguous: 2
  unanswerable: 2

# ---------------------------------------------------------------------------
# TESTS — what the negatives compile down to. See corpus/tests/.
# ---------------------------------------------------------------------------
tests:
  test_negatives_hold:       every assert_no_cooccurrence holds across the corpus
  test_forbidden_words:      no fragment contains its question's unwritten abstraction
  test_no_single_chunk:      no single chunk holds all entities for a multi-hop question
  test_chunking:             the four context-loss boundaries fall where they should
  test_single_answer:        mh-01 has one answer and mh-02 can be reached
  test_unanswerable:         the corpus really does not say
  test_sources_exist:        every expected_sources filename resolves
