# Document spec — derived from corpus/manifest.yaml, which remains authoritative.
#
# The manifest says what must be TRUE and what must be ABSENT across the corpus.
# This says, for each hand-written document, the exact strings it must hold and
# must not hold. corpus/tests/check_source.py reads it against the Markdown in
# corpus/source/ before anything is rendered. If the two files disagree, the
# manifest wins.
#
# SECTION MODEL. Every rendered PDF is written together with a sidecar in
# corpus/sections/ holding its true section titles and page ranges. Ingestion
# does NOT read the sidecar: it detects headings from the PDF the way it would
# on any document. The sidecar is ground truth for measuring that detection.
#
# TIERS. authored (31) carry the facts; constrained (18) and ballast (49) come
# from seeded generators and are checked by their own assertions; special (2)
# are built as PDFs directly. Only authored documents are listed here.

