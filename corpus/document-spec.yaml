# Document spec — derived from corpus/manifest.yaml, which remains authoritative.
#
# The manifest says what must be TRUE and what must be ABSENT.
# This says what each FILE IS: length, section structure, contents, and the
# constraints it has to satisfy. The generator reads this; the tests read the
# manifest. If the two disagree, the manifest wins.
#
# ---------------------------------------------------------------------------
# DECISIONS TAKEN HERE (reversible, but not after generation)
# ---------------------------------------------------------------------------
#
# 1. SECTION MODEL — option C.
#    Every generated PDF is written together with a sidecar <doc>.sections.json
#    holding the true section titles, page ranges and character offsets.
#    Ingestion does NOT read the sidecar: it detects headings from the PDF the
#    way it would on a real corpus. The sidecar is ground truth for the tests.
#    Why: option A (ingestion reads the sidecar) would make any
#    structural-chunking claim untestable — the boundaries would have been
#    handed to us by the thing that wrote the document. Option B (detect only)
#    has no way to know when it is wrong. C measures the detector.
#
# 2. BOM PAGE COUNT — about 55 for the 2025 bill of materials.
#
# 3. THREE TIERS, not two. meta.authored=20 in the manifest is now wrong:
#    the finished question set implies 51 named files, 30 of which are
#    test-covered. See tiers below. Total stays 100.
#
# 4. BALLAST IS GENERATED BY TEMPLATE AND SEED, not by prose generation.
#    Nobody needs a frontier model to write thirty pages of a calibration log.
#    See ballast.contract.

meta:
  derives_from: corpus/manifest.yaml
  corpus_now: "2026-03"
  page_target: ~2000
  document_target: 100

  tiers:
    authored: |
      30 documents. Every one is grepped by at least one test. Frontier model,
      generated one at a time, content checked against the manifest before the
      next tier is paid for. These carry every fact and every negative.
    constrained: |
      18 documents (12 rework monthlies, 6 change requests). Cheap model, rigid
      template, seeded data. Still test-covered — ag-01, ag-02 and ag-03 read
      them — so they are generated from a data table, not improvised.
    special: |
      3 documents that exist to defeat text extraction. See their entries.
    ballast: |
      49 documents. Template plus seeded data, cheapest model, closed
      vocabulary. See ballast.contract.

# ---------------------------------------------------------------------------
# TIMELINE — every date, resolved. Derived from manifest meta.dating_rules.
# ---------------------------------------------------------------------------
timeline:
  "2024-01": doa-2024-01 takes effect; BOM_BV_series_2024 issued (seal = NBR-70)
  "2024-H2": field returns report M8 fasteners backing off in service
  "2024-08": batch 4471 rejected, seal hardness out of tolerance
  "2024-09": CR-88 raised — seal material revised to FKM-70
  "2024-11": revalidation required following the material change
  "2025-01": BOM_BV_series_2025 issued (seal = FKM-70); rework series begins
  "2025-02": recall R-2025-014 raised; first Bamberg nonconformity
  "2025-03": doa-2025-03 takes effect; regulator notified; M8 vibration testing
  "2025-Q1": rig 3 reallocated to the injector programme for six weeks
  "2025-04": corrective action committed, still in progress at corpus_now
  "2025-05": second Bamberg nonconformity
  "2025-06": CR-91 raised — diagonal sequence and 30-minute recheck added
  "2025-08": third Bamberg nonconformity
  "2025-10": fourth Bamberg nonconformity
  "2025-12": rework series ends
  "2026-03": corpus_now
  note: |
    Two independent causal threads, deliberately not cross-referenced anywhere.
    THREAD A (ld-01, the programme slip): batch rejection -> material change ->
    revalidation -> rig reallocation. THREAD B (ld-03, the torque change):
    field returns -> vibration testing -> tolerance review -> CR-91.
    The recall (R-2025-014) is a third thread and touches neither.

# ---------------------------------------------------------------------------
# CONVENTIONS — apply to every authored and constrained document.
# ---------------------------------------------------------------------------
conventions:
  house_style: |
    Engineering records written by the function that owns them, in that
    function's voice. No document ever explains another document. Nobody
    writing one of these knows they are writing part of an answer — that is
    the whole mechanism behind the long-distance questions.
  change_requests: |
    Every CR states what changed, the date, and the procedure revision it was
    raised under. NO CR names a person and NO CR states an approval level.
    This is house style across all eight change requests, which is what makes
    CR-88's silence a convention rather than a contrivance. See
    negatives.authority_split and negatives.ag02_no_register.
  sections: |
    Every document has real section headings, numbered, with a table of
    contents on page 1 for anything over 8 pages. The sidecar records them.
  page_furniture: |
    Every page carries a footer with the document id and page number. Headers
    carry the document title and revision. This is what makes the title-prefix
    fix on page 05 have something to work with.
  absent_everywhere:
    - Regensburg            # un-02
    - warranty              # un-01
    - any plant not in entities.plants
    - any supplier, part, material or person not in entities

# ---------------------------------------------------------------------------
# AUTHORED — 30 documents, every one test-covered. Generate these first,
# check them against the manifest, and only then pay for anything else.
# `verbatim` strings are grepped by test_facts_present and must appear exactly.
# ---------------------------------------------------------------------------
documents:

  - file: recall_R-2025-014.pdf
    tier: authored
    pages: 4
    author_function: Product Safety
    date: "2025-02"
    sections:
      - {title: "1. Scope and affected product", pages: "1-2"}
      - {title: "2. Defect description", pages: "3-4"}
      - {title: "3. Affected batches", pages: "5-6"}
      - {title: "4. Containment actions", pages: "7-8"}
    holds:
      - verbatim: "R-2025-014"
      - verbatim: "BV-12"
      - fact: recall date 2025-02, affected batch numbers
    must_not_hold: [supplier names, Bamberg, any plant name, "FKM-70"]
    serves: [sh-02, mh-01, mh-04, ld-04, un-02]
    negatives: [multihop_supplier, fkm70_undiscoverable]
    notes: |
      Hop 1 of the spine. It names the part and nothing about who makes it or
      where. The absence of supplier and plant names is what makes mh-01 three
      hops rather than one.

  - file: recall_register_2023_2025.pdf
    tier: authored
    pages: 2
    author_function: Product Safety
    date: "2026-01"
    sections:
      - {title: "1. Register of recalls 2023-2025", pages: "1-8"}
      - {title: "2. Closure status", pages: "9-10"}
    holds:
      - fact: tabular list of recalls including R-2025-014, one row each
    must_not_hold: [any closure or sign-off record for R-2025-014, Bamberg]
    serves: [ld-04]
    negatives: [ld04_obligations_open]
    notes: |
      Section 2 lists closure status for every recall EXCEPT R-2025-014, whose
      row reads "open". One word, and it is the only place in the corpus that
      hints the obligations exist at all — without listing them.

  - file: BOM_BV_series_2025.pdf
    tier: authored
    pages: 56
    author_function: Engineering
    date: "2025-01"
    sections:
      - {title: "1. Introduction and revision history", pages: "1-3"}
      - {title: "2. BV-12 assembly", pages: "4-22"}
      - {title: "3. BV-13 assembly", pages: "23-40"}
      - {title: "4. Common components", pages: "41-49"}
      - {title: "5. Approved supplier index", pages: "50-55"}
    holds:
      - verbatim: "Alpha Dichtungen GmbH"
      - verbatim: "Beta Valve Co."
      - verbatim: "FKM-70"
      - fact: BV-12 maximum operating temperature (ASSIGN)
      - fact: BV-13 maximum operating temperature, materially different (ASSIGN)
    must_not_hold: [Bamberg, any plant name, recall references, "NBR-70",
                    any formerly/previously/superseded annotation]
    serves: [sh-01, mh-01, mh-03, mh-04, cl-03]
    negatives: [mh03_identity, multihop_supplier, mh05_material_supersession, gamma_not_bv12]
    layout: |
      Sections 2 and 3 carry the BV-12 and BV-13 spec tables. The maximum
      operating temperature rows must sit in the SAME table layout with the
      part number as the only discriminator — no prose distinguishing them.
      This is what mh-03 turns on.
    notes: about 55 pages.

  - file: BOM_BV_series_2024.pdf
    tier: authored
    pages: 50
    author_function: Engineering
    date: "2024-01"
    sections:
      - {title: "1. Introduction and revision history", pages: "1-3"}
      - {title: "2. BV-12 assembly", pages: "4-20"}
      - {title: "3. BV-13 assembly", pages: "21-36"}
      - {title: "4. Common components", pages: "37-43"}
      - {title: "5. Approved supplier index", pages: "44-48"}
    holds:
      - verbatim: "NBR-70"
      - fact: BV-12 seal material is NBR-70, 2024 supplier set
    must_not_hold: ["FKM-70", "CR-88", any reference to a later revision]
    serves: [mh-05, cl-03]
    negatives: [mh05_material_supersession, cl03_edition_orphaned, gamma_not_bv12]
    layout: |
      cl-03 requires that a 1000-char chunk can contain "NBR-70" with no
      edition identifier in it. So the year appears in the page header and the
      revision-history section, NOT in the body text of section 2.
    notes: |
      Carries mh-05's second hop and cl-03's trap, from opposite directions.

  - file: plant_register.pdf
    tier: authored
    pages: 4
    author_function: Manufacturing Operations
    date: "2025-09"
    sections:
      - {title: "1. Sites and codes", pages: "1-3"}
      - {title: "2. Plant X (Bamberg)", pages: "4-7"}
      - {title: "3. Other sites", pages: "8-10"}
      - {title: "4. Approved supplier lists by site", pages: "11-12"}
    holds:
      - verbatim: "Bamberg"
      - verbatim: "Plant Y (Kassel)"
      - verbatim: "Plant Z (Ingolstadt)"
      - verbatim: "SUP-0311"
      - fact: approved source CODES per site — no supplier company is named anywhere
    must_not_hold_extra: ["Alpha Dichtungen GmbH", "Beta Valve Co.", "Gamma Sealing Systems"]
    must_not_hold: [recall references, "R-2025-014", "BV-12", "BV-13",
                    "Regensburg", any part number]
    serves: [sh-03, mh-01, mh-04, un-02]
    negatives: [multihop_supplier, un02_absent_plant]
    notes: |
      Hop 3 of the spine, and un-02's refusal point. It is the authoritative
      list of sites, which is why the stronger un-02 answer is "the plant
      register does not list a Regensburg site" rather than "no results".

  - file: supplier_register.pdf
    tier: authored
    pages: 5
    author_function: Procurement
    date: "2025-07"
    sections:
      - {title: "1. Approved supplier index", pages: "1-2"}
      - {title: "2. Alpha Dichtungen GmbH", pages: "3-6"}
      - {title: "3. Beta Valve Co.", pages: "7-10"}
      - {title: "4. Gamma Sealing Systems", pages: "11-12"}
      - {title: "5. Regional supply notes", pages: "13-14"}
    holds:
      - verbatim: "Alpha Dichtungen GmbH"
      - fact: Alpha's registered location (ASSIGN)
      - fact: Alpha's served sites — Kassel and Ingolstadt, never Bamberg
      - fact: company records for all three suppliers
    must_not_hold: ["BV-12", "R-2025-014", recall references]
    serves: [sh-05, mh-01]
    negatives: [multihop_supplier]
    layout: |
      Section 5 is the decoy passage page 03 depends on: prose about supply
      into the Bamberg region that mentions Alpha by name, without ever
      stating that Alpha supplies the Bamberg plant. High lexical overlap with
      mh-01, and a wrong answer. It may name Bamberg; it may NOT name BV-12.
    notes: |
      The only document that is both a trap and a source — sh-05 reads it
      correctly, mh-01 is misled by it.

  # --- Thread A: the programme slip (ld-01). Four fragments, four functions. ---

  - file: quality_batch_4471.pdf
    tier: authored
    pages: 3
    author_function: Supplier Quality
    date: "2024-08"
    sections:
      - {title: "1. Batch identification", pages: "1"}
      - {title: "2. Test results", pages: "2"}
      - {title: "3. Disposition", pages: "3"}
    holds:
      - verbatim: "batch 4471"
      - verbatim: "seal hardness out of tolerance"
    must_not_hold: [programme, slip, delay, delayed, schedule, late, Bamberg]
    serves: [sh-04, ld-01]
    negatives: [programme_slip]
    notes: |
      sh-04 reads this in one hop; ld-01 cannot rank it. Same sentence, two
      results — "findable but not rankable", measured.

  - file: testlab_minutes_q1_2025.pdf
    tier: authored
    pages: 3
    author_function: Test Laboratory
    date: "2025-03"
    sections:
      - {title: "1. Attendance", pages: "1"}
      - {title: "2. Rig utilisation", pages: "2-4"}
      - {title: "3. Actions", pages: "5-6"}
    holds:
      - verbatim: "rig 3 reallocated to the injector programme for six weeks"
    must_not_hold: [slip, delay, delayed, late, "BV-12 programme"]
    serves: [ld-01]
    negatives: [programme_slip]
    notes: |
      The word "programme" appears here ONLY as part of "the injector
      programme" — a different programme. That is deliberate: it is the
      nearest the corpus comes to the question's vocabulary, and it points
      the wrong way.

  - file: CR-88_seal_material.pdf
    tier: authored
    pages: 3
    author_function: Engineering Change Board
    date: "2024-09"
    sections:
      - {title: "1. Change description", pages: "1"}
      - {title: "2. Affected assemblies", pages: "2"}
      - {title: "3. Procedure reference", pages: "3"}
    holds:
      - verbatim: "FKM-70"
      - verbatim: "CR-88"
      - verbatim: "BV-12"
      - verbatim: "Class A"
      - fact: change date 2024-09, procedure revision reference
    must_not_hold: [any person's name, any approval level, "Level 3", "NBR-70", "BV-13",
                    programme, slip, delay, schedule, late,
                    maximum operating temperature,
                    any reference to batch 4471 or any other ld-01 fragment]
    serves: [ld-01, mh-02, mh-03, mh-04, mh-05, cl-03]
    negatives: [authority_split, programme_slip, mh03_identity,
                mh05_material_supersession, fkm70_undiscoverable,
                cr88_class_recorded]
    notes: |
      The most constrained document in the corpus — five questions read it and
      four negatives bind it. It states what changed and when, names the part,
      records its class, and says nothing about who approved it, what level
      it needed, or what material it replaced. Every one of those omissions is load-bearing.

  - file: cert_fkm70_revalidation.pdf
    tier: authored
    pages: 2
    author_function: Certification
    date: "2024-11"
    sections:
      - {title: "1. Basis", pages: "1"}
      - {title: "2. Scope of revalidation", pages: "2"}
    holds:
      - verbatim: "revalidation required following the material change"
      - fact: revalidation scheduled, not yet complete as at corpus_now
    must_not_hold: [programme, slip, delay, schedule, late, cost, total]
    serves: [ld-01, ld-04]
    negatives: [programme_slip, ld04_obligations_open]
    notes: |
      Does double duty: fragment 4 of the programme slip, and open obligation
      4 of ld-04. Required in 2024-11 and still outstanding sixteen months
      later, which is unremarkable for a requalification and is exactly what
