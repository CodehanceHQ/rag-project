# ---------------------------------------------------------------------------
# CONSTRAINED — generated from a data table, not improvised. Cheap model for
# prose furniture only; all numbers come from a seeded generator so the runs
# are reproducible and the aggregation answers are known before generation.
# ---------------------------------------------------------------------------
templates:

  rework_monthly:
    files: rework_2025_01.pdf .. rework_2025_12.pdf
    count: 12
    tier: constrained
    pages_each: 2
    author_function: Manufacturing Operations
    sections:
      - {title: "1. Rework counts by plant", pages: "1"}
      - {title: "2. Notes", pages: "2"}
    holds: [{fact: rework counts per plant for that month, as a table}]
    must_not_hold: [annual total, any comparison with another month,
                    any statement of which plant is worst, "CR-91",
                    the torque revision, any procedure change, defect types]
    serves: [ag-01, ag-03]
    negatives: [aggregation_needs_all, ag03_pivot_discovered]
    data_contract: |
      Counts are generated from a fixed seed so the annual winner and the
      before/after split around CR-91 (2025-06) are known BEFORE generation
      and can be asserted, not discovered. Requirements:
        - Plant Z (Ingolstadt) is the clear annual winner on the total
        - the winner is NOT Bamberg — see negatives.aggregation_needs_all
        - NO single month reveals the annual winner
        - the trend answer for ag-01 is unambiguous across all twelve
        - the before/after comparison for ag-03 has at least four months
          either side of 2025-06 and a clear direction
      Section 2 is prose furniture only and carries no numbers.

  change_request_population:
    files: CR-2xx series
    count: 6
    tier: constrained
    pages_each: 2
    author_function: Engineering Change Board
    sections:
      - {title: "1. Change description", pages: "1"}
      - {title: "2. Procedure reference", pages: "2"}
    holds: [{fact: routine BV-series changes — fastener finish, label revision,
                   packaging spec, documentation corrections}]
    must_not_hold: [any person's name, any approval level, "FKM-70", "NBR-70"]
    serves: [ag-02]
    negatives: [ag02_no_register, authority_split, fkm70_undiscoverable]
    data_contract: |
      Change classes are assigned from a fixed seed so the ag-02 answer — how
      many CRs, and how many needed Level 3 — is known before generation.
      Mix must include at least one documentation-only change, so cl-04's
      Level 1 rule has something real to apply to.
      Eight change requests exist in total: CR-88, CR-91 and these six.

# ---------------------------------------------------------------------------
# BALLAST — 49 documents. The part nobody audits, and the part most able to
# silently break the corpus. See negatives.ballast_vocabulary.
# ---------------------------------------------------------------------------
ballast:
  count: 49
  pages_each: 30-36
  contract: |
    Generated by TEMPLATE plus SEEDED DATA, not by prose generation. Nobody
    needs a frontier model to write thirty pages of a calibration log, and a
    model asked to improvise plausible manufacturing documents will invent
    plants, suppliers and part numbers — because that is what makes output
    look real, and it is exactly what breaks the negatives.

    The model writes section headings and a paragraph of framing per section.
    Everything else is a seeded table. This makes ballast reproducible,
    near-free, and incapable of inventing vocabulary.
  types:
    - calibration logs
    - goods receipt registers
    - shift handover records
    - maintenance schedules
    - training records
    - packaging specifications
    - shipping manifests
    - internal audit checklists
  rules:
    - Named things come from entities only. No new plant, supplier, part,
      material, change request, recall or person.
    - No document may contain any pair listed in any assert_no_cooccurrence
      block anywhere in the manifest.
    - No mention of a warranty period, and no plant other than those in
      entities.plants.
    - Repetition is a feature. Real corpora are repetitive, and ballast is
      what makes Path A's failure convincing.
  test: test_negatives_hold runs over ballast as well as authored documents
