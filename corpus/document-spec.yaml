    negatives: [ld03_torque_cause]

  - file: testlab_vibration_M8.pdf
    tier: authored
    pages: 3
    author_function: Test Laboratory
    date: "2025-03"
    sections:
      - {title: "1. Test setup", pages: "1-2"}
      - {title: "2. Results", pages: "3-4"}
      - {title: "3. Observations", pages: "5"}
