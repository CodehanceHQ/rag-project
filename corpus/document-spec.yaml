      - fact: a table of phase dates and milestones, and nothing else
    must_not_hold: [any explanation, any reference to batch 4471, rig 3,
                    "CR-88", revalidation, "FKM-70"]
    serves: [ld-01]
    negatives: [programme_slip, fkm70_undiscoverable]
    notes: |
      The top hit for "why did the BV-12 programme slip?" — it contains two of
      the question's three content words and explains nothing. Its entire job
      is to be retrieved and be useless.

  # --- Torque and work instructions ---

  - file: work_instruction_rev_D.pdf
    tier: authored
    pages: 5
    author_function: Manufacturing Engineering
    date: "2025-06"
    sections:
      - {title: "1. Scope", pages: "1-2"}
      - {title: "2. Tooling", pages: "3-5"}
      - {title: "3. Sub-assembly", pages: "6-10"}
      - {title: "4. Housing assembly", pages: "11-15"}
      - {title: "5. Inspection", pages: "16-18"}
    holds:
      - verbatim: "M8"
      - verbatim: "40 Nm"
      - verbatim: "diagonal"
      - fact: recheck after 30 minutes
    must_not_hold: ["BV-13", any torque value other than 40 Nm]
    serves: [cl-01, am-02, ld-03]
    negatives: [torque_referent, am02_undisambiguated_fastener]
    layout: |
      CRITICAL, and the one layout requirement in this file that is measured
      rather than eyeballed. In section 4, the fastener must be named at least
      two paragraphs before the torque value, with enough text between them
      that a 1000-char fixed-width split can land a chunk containing "40 Nm"
      and "Tighten in a diagonal sequence" but NOT "M8". Verify against the
      real chunker, not by reading it. See negatives.torque_referent.
    notes: Issued under CR-91. The revision that adds the sequence and the recheck.

  - file: work_instruction_rev_C.pdf
    tier: authored
    pages: 5
    status: superseded
    author_function: Manufacturing Engineering
    date: "2024-02"
    sections:
      - {title: "1. Scope", pages: "1-2"}
      - {title: "2. Tooling", pages: "3-5"}
      - {title: "3. Sub-assembly", pages: "6-10"}
      - {title: "4. Housing assembly", pages: "11-14"}
      - {title: "5. Inspection", pages: "15-16"}
    holds:
      - verbatim: "M8"
      - verbatim: "40 Nm"
    must_not_hold: [diagonal, recheck, any torque value other than 40 Nm]
    serves: [ld-03]
    notes: |
      SAME value as rev D, without the sequence or the recheck. The asymmetry
      is deliberate: a superseded revision can only produce an INCOMPLETE
      answer, never a contradictory one, so cl-01 keeps exactly one failure
      mode. See entities.records.CR-91.

  - file: work_instruction_BV13.pdf
    tier: authored
    pages: 5
    author_function: Manufacturing Engineering
    date: "2025-06"
    sections:
      - {title: "1. Scope", pages: "1-2"}
      - {title: "2. Tooling", pages: "3-4"}
      - {title: "3. Sub-assembly", pages: "5-9"}
      - {title: "4. Housing assembly", pages: "10-12"}
      - {title: "5. Inspection", pages: "13-14"}
    holds:
      - verbatim: "BV-13"
      - fact: housing bolt fastener size, NOT M8 (ASSIGN)
      - fact: torque value, NOT 40 Nm (ASSIGN)
    must_not_hold: ["BV-12", "40 Nm", "M8",
                    any statement that one assembly is the default]
    serves: [am-02]
    negatives: [am02_undisambiguated_fastener]
    notes: |
      Deliberately similar in language and structure to rev D — that
      similarity is the point. Two documents that answer "what is the
      tightening torque for the housing bolts?" differently, neither of which
      admits the other exists.

  # --- Authority chain ---

  - file: material_change_approval_procedure.pdf
    tier: authored
    pages: 4
    author_function: Quality Management System
    date: "2024-06"
    sections:
      - {title: "1. Purpose", pages: "1"}
      - {title: "2. Change classes", pages: "2-4"}
      - {title: "3. Authority levels", pages: "5-8"}
      - {title: "4. Records", pages: "9-11"}
    holds:
      - verbatim: "Level 3"
      - verbatim: "Level 1"
      - fact: Level 3 required for material change affecting a safety-critical interface
      - fact: Level 1 required for a documentation-only change
    must_not_hold: [any person's name, any delegation matrix id, "CR-88"]
    serves: [mh-02, mh-04, cl-04, am-01, ag-02]
    negatives: [authority_split, cl04_scope_orphaned]
    layout: |
      In section 3 the Level 3 requirement must be preceded by its scoping
      sentence ("For changes affecting a safety-critical interface...") with
      enough text between them that a 1000-char split can strand the rule from
      its scope. Verify against the real chunker. See cl04_scope_orphaned.
    notes: |
      Names LEVELS, never PEOPLE. That split is what keeps mh-02 at four hops.

  - file: doa_matrix_2024_01.pdf
    tier: authored
    pages: 3
    status: superseded
    author_function: Corporate Governance
    date: "2024-01"
    sections:
      - {title: "1. Effective date and scope", pages: "1"}
      - {title: "2. Authority levels 1-2", pages: "2-3"}
      - {title: "3. Authority level 3", pages: "4-5"}
    holds:
      - fact: PERSON_A holds Level 3 (name ASSIGN)
      - verbatim: "2024-01"
    must_not_hold: ["CR-88", PERSON_B, any statement that it is the only matrix,
                    any reference to doa-2025-03]
    serves: [mh-02, mh-04, am-01]
    negatives: [authority_split, am01_undated_authority]
    notes: |
      In force when CR-88 was raised. Does not know it will be superseded —
      which is why an undated question (am-01) cannot be resolved from it.

  - file: doa_matrix_2025_03.pdf
    tier: authored
    pages: 3
    author_function: Corporate Governance
    date: "2025-03"
    sections:
      - {title: "1. Effective date and scope", pages: "1"}
      - {title: "2. Authority levels 1-2", pages: "2-3"}
      - {title: "3. Authority level 3", pages: "4-5"}
    holds:
      - fact: PERSON_B holds Level 3 (name ASSIGN)
      - verbatim: "2025-03"
    must_not_hold: ["CR-88", PERSON_A, any reference to doa-2024-01]
    serves: [am-01]
    negatives: [authority_split, am01_undated_authority]
    notes: |
      The naive answer to mh-02 and one horn of am-01. Neither matrix
      references the other — that is what makes am-01 ambiguous rather than
      merely out of date.

  - file: role_appointments.pdf
    tier: authored
    pages: 2
    author_function: Human Resources
    date: "2026-01"
    sections:
      - {title: "1. Appointments by role", pages: "1-6"}
      - {title: "2. Historic appointments", pages: "7-9"}
    holds:
      - fact: who held which role, with start and end dates, covering PERSON_A and PERSON_B
    must_not_hold: [any authority level, "CR-88", any delegation matrix id]
    serves: [mh-02, mh-04]
    negatives: [authority_split]
    notes: |
      Connects names to dates without connecting either to authority. The
      fourth hop of mh-02 — and the reason it is four hops and not three.

  # --- Thread B fragments: why the torque procedure changed (ld-03) ---

